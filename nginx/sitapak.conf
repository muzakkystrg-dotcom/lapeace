# ==============================================================================
# NGINX PRODUCTION CONFIGURATION: SITAPAK SIDOARJO (WEBUZO VPS HARDENED)
# Standar: OWASP Top 10, ISO 27001, TLS 1.2/1.3 Only, Rate Limiting
# ==============================================================================

# Rate Limiting: 20 req/sec untuk API umum, 5 req/min untuk endpoint login auth
limit_req_zone $binary_remote_addr zone=sitapak_api_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=sitapak_auth_limit:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name sitapak.sidoarjokab.go.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sitapak.sidoarjokab.go.id;

    # 1. SSL/TLS Hardening (Modern TLS Only)
    ssl_certificate /etc/ssl/certs/sitapak_bundle.crt;
    ssl_certificate_key /etc/ssl/private/sitapak.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 2. Hardened Security Headers (Anti-Clickjacking, Anti-MIME Sniff, HSTS)
    server_tokens off;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https:; object-src 'none'; frame-ancestors 'none';" always;

    # 3. Buffer Limits & HTTP Keep-Alive
    client_body_buffer_size 128k;
    client_max_body_size 10M; # Maksimal upload lampiran 10MB
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    client_body_timeout 12;
    client_header_timeout 12;
    keepalive_timeout 65;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # 4. High-Performance Compression (Gzip & Brotli)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff2;

    # 5. Frontend Statis (Vite / React Build Output)
    root /home/jukijek/project/lapeace/dist;
    index index.html;

    # Vite Hashed Assets: Caching Maksimal (1 Tahun Immutable)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Gambar, Icon, WebP, dan Font Statis
    location ~* \.(jpg|jpeg|png|gif|ico|webp|svg|woff2|woff|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
        access_log off;
    }

    location / {
        # index.html tidak boleh di-cache permanen agar user segera mendapat update deploy
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # 6. Reverse Proxy API NestJS
    location /api/ {
        limit_req zone=sitapak_api_limit burst=30 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # 6. Proteksi Khusus Login (Anti-Brute Force Protection)
    location /api/auth/login {
        limit_req zone=sitapak_auth_limit burst=5 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 7. Blokir Akses Berkas Sensitif & Tersembunyi (.git, .env, .db, .sql)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(sql|db|sqlite|env|log|bak|git)$ {
        deny all;
        return 404;
    }
}
